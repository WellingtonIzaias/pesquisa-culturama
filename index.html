<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="name">Nome</label>
                <input id="name" type="text" name="userName" required>
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userAges" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de nascimento</label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+Numero sem espaços">
                <br>
                <label for="image">Upload de foto</label>
                <input id="iamge" type="file" accept="image/*" name="userImage">
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>

                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>

                <input id="notInfo" type="radio" name="userGender" value="notInformed">
                <label for="notInfo">Prefiro não informar</label>
                <br>    

                <label for="statusCivil">Estado civil:</label>
                <select name="maritalStatus" id="statusCivil">
                    <option value="notInformed">Selecione</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="casado">União estavel</option>
                </select>
                <br>
                <label for="state">Estado:</label>
                <select name="userState" id="state">
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <label for="city">Cidade:</label>
                <input type="text" placeholder="Ex: São Paulo" name="userity" id="city">
            </fieldset>
                
            <fieldset>
                <legend>Habitos</legend>

                <p>Redes Sociais</p>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>
                <input id="X" type="checkbox" name="social" value="X">
                <label for="X">X</label>
                <br>
                <label for="musicStyle">Estilo musical</label>
                <input list="styleTypes" type="text" id="musicStyle" name="music">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Sertanejo">
                    <option value="Funk">
                    <option value="Samba">
                </datalist>
                <br>
                <label for="favoriteColor">Cor favorita</label>
                <input type="color" name="userFavoriteColor" id="favoriteColor">
            </fieldset>

            <fieldset>
                <legend>Avaliação</legend>

                <p>Avalie sua satisfação</p>
                <input type="radio" name="gradeUser" id="ruim" value="ruim">
                <label for="ruim">Ruim</label>
                <input type="radio" name="gradeUser" id="regular" value="regular">
                <label for="regular">Regular</label>
                <input type="radio" name="gradeUser" id="bom" value="boa">
                <label for="bom">Bom</label>
                <input type="radio" name="gradeUser" id="excelente" value="excelente">
                <label for="excelente">Excelente</label>
                <br>
                <label for="comment">Comentario(Opcional)</label>
                <textarea name="commentUser" id="comment" placeholder="Digite seu comentario aqui"></textarea>
            </fieldset>

            <fieldset>
                <legend>Confimações</legend>

                <input type="checkbox" name="userLGPD" id="userLPGDTerm" value="confirmed" required>
                <label for="userLPGDTerm">Aceito participar da pesquisa</label>

                <input type="checkbox" name="userGetResult" id="userResult" value="confirmed">
                <label for="userResult">Quero receber o resultado por e-mail</label>
            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
